version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: michael_aluminum
      POSTGRES_USER: michael
      POSTGRES_PASSWORD: secure_password_here
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U michael"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 MichaelAluminum.wsgi:application
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: "your-secret-key-here"
      DATABASE_URL: "postgresql://michael:secure_password_here@db:5432/michael_aluminum"
      ALLOWED_HOSTS: "localhost,127.0.0.1,web"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build: .
    command: celery -A MichaelAluminum worker -l info
    volumes:
      - .:/app
    environment:
      DEBUG: "False"
      SECRET_KEY: "your-secret-key-here"
      DATABASE_URL: "postgresql://michael:secure_password_here@db:5432/michael_aluminum"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - db
      - redis
      - web

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
